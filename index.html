<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抓取表格內容</title>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; }
    button { padding: 12px 24px; font-size: 18px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #result { margin-top: 20px; font-size: 22px; font-weight: bold; color: #333; }
  </style>
</head>
<body>

  <h2>抓取今彩539資料3</h2>
  <button onclick="fetchData()">點我抓取第二個 TR 的第二個 TD</button>
  <div id="result">尚未抓取</div>

  <script>
    async function fetchData() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerText = "讀取中，請稍候...";

      const targetUrl = 'https://www.9800.com.tw/lotto539/';
      
      // 使用 raw 模式繞過防爬蟲轉頁
      const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);

      try {
        const response = await fetch(proxyUrl);
        const htmlText = await response.text();
        
        // 解析 HTML
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        // 取得所有的 TR
        const rows = doc.querySelectorAll('tr');

        if (rows.length >= 2) {
          // 第二個 TR (索引 1)
          const secondRow = rows[1];
          const tds = secondRow.querySelectorAll('td');

          if (tds.length >= 2) {
            // 第二個 TD (索引 1)
            const secondTdText = tds[1].innerText.trim();
            resultDiv.innerText = "抓到的內容是：" + secondTdText;
          } else {
            resultDiv.innerText = "找到第二個 TR，但裡面沒有第二個 TD！";
          }
        } else {
          resultDiv.innerText = "抓取到網頁，但無表格內容（可能被網站反爬蟲擋下）";
        }

      } catch (error) {
        console.error(error);
        resultDiv.innerText = "抓取失敗，請稍後再試！";
      }
    }
  </script>

</body>
</html>
