<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>抓取表格內容</title>
  <style>
    body { font-family: sans-serif; padding: 20px; text-align: center; }
    button { padding: 12px 24px; font-size: 18px; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; }
    #result { margin-top: 20px; font-size: 22px; font-weight: bold; color: #333; }
  </style>
</head>
<body>

  <h2>抓取今彩539資料</h2>
  <button onclick="fetchData()">點我抓取第二個 TR 的第二個 TD</button>
  <div id="result">尚未抓取</div>

  <script>
    async function fetchData() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerText = "讀取中，請稍候...";

      const targetUrl = 'https://www.9800.com.tw/lotto539/';
      
      // 改用 corsproxy.io，速度更穩定
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(targetUrl);

      try {
        const response = await fetch(proxyUrl);
        const htmlText = await response.text();
        
        // 將 HTML 文字轉成 DOM 物件
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');

        // 取得所有的 TR (不分大小寫)
        const rows = doc.querySelectorAll('tr');

        if (rows.length >= 2) {
          // 第二個 TR (索引為 1)
          const secondRow = rows[1];
          const tds = secondRow.querySelectorAll('td');

          if (tds.length >= 2) {
            // 第二個 TD (索引為 1)
            const secondTdText = tds[1].innerText.trim();
            resultDiv.innerText = "抓到的內容是：" + secondTdText;
          } else {
            resultDiv.innerText = "找到第二個 TR，但裡面沒有第二個 TD！";
          }
        } else {
          resultDiv.innerText = "網頁中沒有找到足夠的 TR 標籤！";
        }

      } catch (error) {
        console.error(error);
        resultDiv.innerText = "抓取失敗，請確認連線或代理伺服器狀況！";
      }
    }
  </script>

</body>
</html>
